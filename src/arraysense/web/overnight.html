<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Overnight · Solar ArraySense</title>
<!-- uPlot draws the projection against a time axis, so its script travels
     with its stylesheet: a canvas drawn without the layout rules keeps its
     raw device-pixel size and paints itself across the page behind
     everything else, which is how the Efficiency chart once shipped. The
     shared front end loads after both so the page's own rules come second
     in the cascade. -->
<link rel="stylesheet" href="/vendor/uPlot.min.css">
<script src="/vendor/uPlot.iife.min.js"></script>
<script src="/common.js"></script>
<style>
  .plan{display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
  .plan h2{margin:2px 0 0;font-size:18px;font-weight:300;letter-spacing:-.02em}
  /* The three lines compared in one picture is the whole reason this is a
     chart: the question is which night ends how far down, and the answer is
     a comparison. Legend and axes come from uPlot's own labels. */
  #planChartWrap{height:260px}
  .chartlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:6px}
  .chartlegend i{display:inline-block;width:18px;height:2px;margin-right:5px;vertical-align:middle}
  .scen td:first-child{font-weight:600;color:var(--ink2)}
  .scen td{font-variant-numeric:tabular-nums}
  .scen .why{color:var(--ink3);font-size:11px}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;
    background:var(--tint);color:var(--ink3);margin-right:8px}
  .badge.stale{background:var(--warn);color:var(--panel)}
  .guidance{margin:8px 0;padding:8px 12px;border-left:3px solid var(--warn);
    font-size:12px;color:var(--ink2)}
  .guidance li{margin:3px 0}
  .assumptions{font-size:11px;color:var(--ink3);line-height:1.7}
  .assumptions li{margin:2px 0}
  /* The charge control is one object with two lines of state above it, not two
     more paragraphs and a loose row of controls. The lines are ink2 and ink3
     because they report the device rather than the plan. The accent edge marks
     it as the one place on this page that writes to the inverter, and it goes
     through --accent rather than a page-local token: a token nothing defines
     falls back to nothing, so the border and the slider's accent were both
     being dropped in silence until this was measured in a browser. */
  .charge{display:flex;flex-direction:column;gap:8px;padding:10px 12px;
    border-left:3px solid var(--accent);background:var(--tint);
    border-radius:0 8px 8px 0}
  /* display:flex beats the browser's own [hidden] rule, so hidden has to be
     given back or the panel is on screen on every installation that has
     nothing to charge — which is what the 404 from /api/charge means. */
  .charge[hidden]{display:none}
  .cstat{margin:0;font-size:12px;color:var(--ink2)}
  .ccfg{margin:0;font-size:11px;color:var(--ink3)}
  .cctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cctl[hidden]{display:none}
  .clabel{font-size:11px;color:var(--ink3)}
  /* Both buttons are tint with ink text. A charge and a stop are not a good
     thing and a bad thing, and colour that says otherwise is colour somebody
     learns to ignore; the sentence inside each button is what carries it. */
  .cctl select,.cctl button{font:inherit;font-size:12px;padding:6px 10px;
    border-radius:7px;background:var(--tint);color:var(--ink);
    border:1px solid var(--panel-b)}
  /* The power is a slider from the installation's floor to the inverter's own
     AC charge maximum, and what it is set to is printed beside it: a handle
     with no number on it is a control nobody can read back. */
  .cctl input[type=range]{flex:1;min-width:110px;accent-color:var(--accent);
    background:transparent;border:0;padding:0}
  .cnow{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;
    min-width:54px;text-align:right}
  .cplan{margin:0;font-size:11px;color:var(--ink3)}
  .cplan[hidden]{display:none}
  /* A press in flight has to look like one. The label changes with it, but a
     label alone is easy to miss on a button the eye has already left, so the
     whole control dims until the answer comes back. */
  .cctl button:disabled{opacity:.6;cursor:default}
  .cwhy{margin:0;font-size:11px;color:var(--warn)}
  .cwhy[hidden]{display:none}
</style>
<link id="appearance-sheet" rel="stylesheet" href="/theme-glass.css">
<script>applyStoredAppearance();</script>
</head>
<body>
<div class="sunglow"></div>
<main>
  <header>
    <h1>Solar ArraySense</h1>
    <div class="hright">
      <div class="conn" id="conn"><span class="dot" style="background:var(--ink3)"></span>connecting…</div>
      <button id="settingsBtn" class="iconbtn" title="Settings" aria-label="Settings"><svg class="ic" aria-hidden="true"><use href="#ph-gear"></use></svg></button>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Views"></nav>

  <section class="p plan" id="planSec">
    <h2>Overnight plan</h2>
    <p id="planNote">Loading…</p>
    <!-- The grid charge sits here, under the line that says the state of
         charge cannot be trusted, because that is the sentence that makes the
         owner want to fix it. It is hidden until /api/charge answers 200: an
         installation whose driver cannot report charge configuration gets no
         panel at all, because an empty one reads as a device that was asked
         and had nothing to say, which is a different claim than the 404. -->
    <section class="charge" id="chargePanel" hidden>
      <p class="cstat" id="chargeStatus"></p>
      <p class="ccfg" id="chargeConfig"></p>
      <div class="cctl" id="chargeCtl" hidden>
        <label class="clabel" for="chargePower">Charge power</label>
        <!-- The handle runs from the driver's floor to the inverter's own AC
             charge maximum, and the wiring re-reads both from the API so the
             range cannot drift from the numbers the server enforces. The
             attributes here are the fallback for the first paint only. -->
        <input type="range" id="chargePower" min="1" max="12" step="0.1" value="3"
               aria-describedby="chargePowerNote">
        <output class="cnow" id="chargePowerOut" for="chargePower">3 kW</output>
      </div>
      <p class="cplan" id="chargePowerNote" hidden></p>
      <div class="cctl">
        <button type="button" id="chargeGo" hidden>Charge to full from grid at 3 kW</button>
        <button type="button" id="chargeStop" hidden>Stop and put the inverter back</button>
      </div>
      <p class="cwhy" id="chargeWhy" hidden></p>
    </section>
    <div class="guidance"><ul id="guidanceBox"></ul></div>
    <div class="chart" id="planChartWrap" role="img"
      aria-label="Projected battery state of charge through the night"></div>
    <div class="chartlegend">
      <span><i style="background:var(--pv)"></i>typical night</span>
      <span><i style="background:var(--batt)"></i>essential loads</span>
      <span><i style="background:var(--grid)"></i>with a scheduled load</span>
      <span><i style="background:var(--ink3)"></i>reserve floor</span>
    </div>
    <table class="scen">
      <thead><tr><td>Scenario</td><td>Ends at</td><td>Below reserve</td><td>Import from</td></tr></thead>
      <tbody id="scenRows"></tbody>
    </table>
    <ul class="assumptions" id="assumptionsBox"></ul>
  </section>
</main>
<script>
drawNav('overnight');

// >>> overnight-page
// The page draws ranges and states, not points. The inputs support a window
// (a spread across comparable nights, a drift band on the state of charge),
// and a single timestamp printed over them would be the fabricated-precision
// bug the issue names: the page shows both edges when there is a spread, and
// says so when there is nothing to project on. The three scenario names are
// the API's own keys so legend, rows and response read alike.

// The colour each scenario is drawn in, as the token to read rather than the
// colour itself. A canvas cannot parse a custom property, so the value has to
// be resolved through ink() at draw time -- which is also what lets the theme
// change the chart with it. The three are the palette's own measured-apart
// series hues and not hues invented here, and the legend markup below names
// the same tokens so the two are two readings of one decision.
const SCENARIO_INK = {
  typical: '--pv',
  essential: '--batt',
  scheduled: '--grid',
};

// One row per scenario the response answered. An unanswered scenario is a
// null and gets no row: a line and a number for a night nobody projected is
// the same lie as a drawn zero for an unmeasured reading. The end SoC is the
// curve's last point; when there is no curve the row carries its reason
// rather than a number, because a missing reading is a dash, never a zero.
function scenarioRows(data) {
  const clock = (iso) => (typeof iso === 'string' ? iso.slice(11, 16) : '');
  const scens = data.scenarios || {};
  const out = [];
  for (const name of ['typical', 'essential', 'scheduled']) {
    const s = scens[name];
    if (!s) continue;
    const curve = s.trajectory || [];
    const last = curve.length ? curve[curve.length - 1][1] : null;
    const ends = last === null || !isFinite(last)
      ? '<span class="why">' + esc(s.reason || 'no curve') + '</span>'
      : last.toFixed(1) + '%';
    const crossed = s.reserve_window && s.range_basis
      ? clock(s.reserve_window[0]) + ' to ' + clock(s.reserve_window[1])
      : clock(s.reserve_crossing);
    out.push('<tr><td>' + esc(name) + '</td><td>' + ends + '</td><td>'
      + esc(crossed) + '</td><td>' + esc(clock(s.import_start)) + '</td></tr>');
  }
  return out.join('');
}

// Guidance arrives as plain sentences and leaves as list items. Interpolated
// raw, a sentence containing a tag would be markup the page never approved;
// esc is why it can stay data.
function guidanceList(data) {
  return (data.guidance || []).map((g) => '<li>' + esc(g) + '</li>').join('');
}

// The chart is one picture of the night, not three. uPlot's time scale
// counts seconds; every scenario keeps its own timestamps and a shared axis
// fills from them, a null where a curve has none. The reserve line is the
// floor itself, held at the response's min_soc_pct rather than an assumed
// height, so the page and the planner can never disagree about where the
// night ends.
function drawPlan(data) {
  const inputs = data.inputs || {};
  const stale = inputs.stale === true;
  const socNow = typeof inputs.soc_now_pct === 'number'
    ? inputs.soc_now_pct.toFixed(1) + '% state of charge'
    : 'no state of charge on record';
  const note = document.getElementById('planNote');
  note.innerHTML = (stale
    ? '<span class="badge stale">SoC reading is stale</span>'
    : '') + esc(socNow) + ', projected from the last readings';

  const scens = data.scenarios || {};
  const lines = ['typical', 'essential', 'scheduled'].filter((n) => scens[n]);
  const stamps = new Set();
  lines.forEach((n) => (scens[n].trajectory || [])
    .forEach((p) => stamps.add(Date.parse(p[0]) / 1000)));
  const xs = Array.from(stamps).sort((a, b) => a - b);
  const valuesOf = (n) => {
    const byStamp = new Map((scens[n].trajectory || [])
      .map((p) => [Date.parse(p[0]) / 1000, p[1]]));
    return xs.map((t) => (byStamp.has(t) ? byStamp.get(t) : null));
  };
  const reserve = typeof inputs.min_soc_pct === 'number'
    ? inputs.min_soc_pct : null;

  const series = [{label: 'x'}];
  const columns = [xs];
  // Each series carries its own column as data as well as riding in the
  // chart-wide array, because it is the handle that lets a reader (here and
  // in the seam test) see what height was actually drawn, series by series.
  // The colour comes through ink(), which reads the token out of the
  // stylesheet and hands the canvas a real colour: a canvas cannot parse
  // `var(--x)` and drops the assignment without a word, which is how this
  // chart drew four black lines under a legend promising three hues. These
  // are three of the palette's measured-apart series hues rather than hues
  // invented here, and the legend below names the same tokens so the two
  // cannot drift apart.
  lines.forEach((n) => {
    const column = valuesOf(n);
    series.push({label: n, stroke: () => ink(SCENARIO_INK[n]), data: column});
    columns.push(column);
  });
  if (reserve !== null) {
    const floor = xs.map(() => reserve);
    // A dash pattern and not a function. The vendored build hands a series'
    // dash straight to the canvas's setLineDash, which takes a pattern of
    // numbers: a function there throws inside the draw pass, after the axes
    // are painted, and the floor is the series that never lands -- measured
    // on production 2026-09-12, where this line drew nothing at all. The
    // other pages' chart specs pass a pattern for the same reason.
    series.push({label: 'reserve', show: true, stroke: () => ink('--ink3'),
      width: 1, dash: [6, 4], points: {show: false}, data: floor});
    columns.push(floor);
  }

  const wrap = document.getElementById('planChartWrap');
  if (wrap && typeof uPlot !== 'undefined' && xs.length > 1) {
    // The data is the constructor's second argument and the element is its
    // third. The vendored build takes whatever it is handed second as its
    // columns and only falls back to `opts.data`, so an element passed there
    // is read as a column of columns and the constructor throws on it. The
    // throw lands after the state-of-charge line is written and before the
    // table, the guidance and the assumptions are: on production 2026-09-12
    // the reader got the error sentence in place of the state of charge and
    // nothing else in the projection at all. common.js's paint() passes all
    // three arguments for the same reason.
    const plot = new uPlot({
      width: wrap.clientWidth || 600,
      height: 260,
      scales: {x: {time: true}, y: {min: 0, max: 100}},
      series: series,
      // The axes come from the shared factory for the same reason the colours
      // go through ink(): uPlot's own defaults are black, so on this panel the
      // gridlines and the tick labels were being drawn in a colour nobody
      // chose and could not be read. The factory also puts every axis on the
      // theme's own ink and gridline tokens, which is what lets a change of
      // look reach them.
      axes: [
        timeAxis(),
        axis({size: 34, values: (u, splits) => splits.map((v) => v.toFixed(0) + '%')}),
      ],
    }, columns, wrap);
    void plot;
  }

  document.getElementById('guidanceBox').innerHTML = guidanceList(data);
  document.getElementById('assumptionsBox').innerHTML = (data.assumptions || [])
    .map((a) => '<li>' + esc(a) + '</li>').join('');
  document.getElementById('scenRows').innerHTML = scenarioRows(data);
}
// <<< overnight-page

// >>> charge-panel
// The charge control's rules, kept apart from the wiring below so they can run
// under node (tests/test_charge_panel_js.py). Nothing here decides whether a
// charge is allowed: that is settled in charge.py from the site limit and the
// house's current draw, and a limit compared in two places is two limits the
// day one of them moves. What these do is say what is true and what pressing
// a button would do.
//
// A field the device did not report never prints as a zero or as "off". The
// chart above already draws a dash for an unmeasured reading for this exact
// reason: 0 kW and "off" are both states somebody could act on, and the
// inverter never said either one.

// One place words a power, because the status line and the button describe the
// same kilowatts and must not read differently about them.
const chargeKw = (w) => (typeof w !== 'number' || !isFinite(w) ? ''
  : (Number.isInteger(w / 1000) ? String(w / 1000) : (w / 1000).toFixed(1)) + ' kW');

// The page prints clock times, not timestamps, for the reason given at the top
// of this script. The API's window edge arrives as a full timestamp, and it is
// an instant: it is rendered in the reader's own clock rather than in whatever
// offset the server happened to write it with. Slicing the characters of the
// string instead printed 13:39 for a window that ends at 08:39 here, because the
// record behind it had been written with a UTC offset — and a page that prints
// one clock for the window and another for the wall clock beside it is worse
// than one that prints none.
const chargeClock = (iso) => {
  if (typeof iso !== 'string' || iso === '') return '';
  const at = new Date(iso);
  if (isNaN(at.getTime())) return '';
  const two = (n) => (n < 10 ? '0' + n : String(n));
  return two(at.getHours()) + ':' + two(at.getMinutes());
};

function chargePanelVisible(charge) {
  return typeof charge === 'object' && charge !== null && !Array.isArray(charge);
}

function chargeStopVisible(charge) {
  if (!chargePanelVisible(charge)) return false;
  const o = charge.override || {};
  return o.recorded === true && o.readable === true;
}

function chargeStatusLine(charge, nowMs) {
  if (!chargePanelVisible(charge)) return '';
  const o = charge.override || {};
  // An unreadable record gets a warning instead of buttons. A charge may be
  // running on a record this service cannot decode, and the damaged record is
  // the only description of how to undo it — so the page says to look at the
  // inverter rather than offering a stop that has nothing to write back, or a
  // start that would stack a second override on the first.
  if (o.recorded === true && o.readable !== true) {
    return 'A charge this service started cannot be read back, so the inverter '
      + 'may still be holding it. Check the charge settings on the inverter '
      + 'before starting another charge.';
  }
  const until = chargeClock(o.until);
  if (o.recorded === true && o.active === true) {
    const at = chargeKw(charge.power_w);
    const window = until ? ' until ' + until : '';
    // A charge needs two things on the device, not one: the enable bit and a
    // window to charge in. The bit alone is not a charge — on this installation
    // the owner's own AC-charge bit is set with its window empty, which is a
    // device that is not charging at all. The record is written before the
    // inverter is touched and kept when a write fails, which is the other way an
    // active record comes to stand over a device that is doing nothing.
    const windows = Array.isArray(charge.windows)
      ? charge.windows.filter((w) => w && w.is_set === true).length
      : null;
    if (charge.ac_charge_enabled === false) {
      return 'A charge is recorded' + window + ', but the inverter reports AC charging off, '
        + 'so it is not charging. Stopping puts the inverter back the way it was.';
    }
    if (windows === 0) {
      return 'A charge is recorded' + window + ', but the inverter holds no charge window, '
        + 'so nothing is charging. Stopping puts the inverter back the way it was.';
    }
    if (charge.ac_charge_enabled === true) {
      return 'Charging from the grid' + (at ? ' at ' + at : '') + window + '.';
    }
    return 'A charge is recorded' + (at ? ' at ' + at : '') + window
      + '. The inverter has not said whether it is charging.';
  }
  if (o.recorded === true) {
    // A window that ran out is not a charge that stopped: the override stays
    // on the inverter until the owner clears it, which is the whole reason the
    // stop button is still offered here.
    return 'The charge window closed' + (until ? ' at ' + until : '')
      + '. Stopping puts the inverter back the way it was.';
  }
  return 'No grid charge is running.';
}

function chargeConfigLine(charge) {
  if (!chargePanelVisible(charge)) return '';
  const MISSING = 'not reported';
  const ac = charge.ac_charge_enabled === true ? 'AC charging is on'
    : charge.ac_charge_enabled === false ? 'AC charging is off'
      : 'AC charging ' + MISSING;
  const power = chargeKw(charge.power_w) || ('power ' + MISSING);
  const stop = typeof charge.stop_soc_pct === 'number' && isFinite(charge.stop_soc_pct)
    ? 'stops at ' + charge.stop_soc_pct + '%' : 'stop state of charge ' + MISSING;
  // A window that was never set is a different fact from no windows at all,
  // so an absent list says so rather than counting zero of them.
  const windows = Array.isArray(charge.windows)
    ? charge.windows.filter((w) => w && w.is_set === true).length
    : null;
  const windowText = windows === null ? 'time windows ' + MISSING
    : windows === 0 ? 'no time window set'
      : windows + (windows === 1 ? ' time window set' : ' time windows set');
  return [ac, power, stop, windowText].join(' · ');
}

// What the primary button would do, in one place: it either starts a charge or
// changes the power of the one that is running, and a page that offered the same
// button for both without saying which would be promising two different things
// in one sentence. An unreadable record has no button at all: there is no
// configuration to write back and no way to know what the device is running.
function chargeGoAction(charge) {
  if (!chargePanelVisible(charge)) return null;
  const o = charge.override || {};
  if (o.recorded !== true) return 'start';
  if (o.readable !== true) return null;
  // A record standing is not a charge running: the record is written before the
  // inverter is touched and kept when a write fails. Changing the power of a
  // charge needs the two things a charge needs — the enable bit and a window to
  // charge in — so a record over a device that reports anything else is a record
  // to stop rather than one to tune. This installation's resting state is
  // exactly that: its own charge bit set with the window empty.
  if (charge.ac_charge_enabled !== true) return null;
  const windows = Array.isArray(charge.windows)
    ? charge.windows.filter((w) => w && w.is_set === true).length : null;
  return windows === 0 ? null : 'power';
}

// The label is a promise about the press, never a report of the device. A
// button labelled with the current state is a coin toss every time; one
// labelled with the action can be checked against what actually happened.
function chargeActionLabel(powerW) {
  const at = chargeKw(powerW);
  return 'Charge to full from grid' + (at ? ' at ' + at : '');
}

// The same promise for the other thing the button does. Changing the power of a
// running charge moves register 66 and nothing else — not the window the charge
// is running inside, not the recorded undo — so the sentence promises only the
// power.
function chargeChangeLabel(powerW) {
  const at = chargeKw(powerW);
  return 'Change the charge to' + (at ? ' ' + at : ' the chosen power');
}

// The slider works in kilowatts and the API takes watts. One conversion, in one
// place, because the label, the preview and the request have to mean the same
// number by the time anything compares them. A tenth of a kilowatt is the
// device's own hundred-watt unit, so the value that leaves here is the value the
// inverter is written with rather than a rounding of it.
const chargeSliderWatts = (value) => {
  const kw = Number(value);
  return isFinite(kw) && kw > 0 ? Math.round(kw * 10) * 100 : 0;
};

// What the chosen power will actually run at, which is not always what was
// chosen: the site limit, the house's draw and the reserve come off it, so 12 kW
// asked for while the house draws 5 kW runs at 6 kW. The page has already once
// reported the charge it promised rather than the charge it started, so the
// numbers behind the decision are printed here, before the press.
function chargePlanLine(plan, action, runningW) {
  if (!chargePanelVisible(plan)) return '';
  // Which verb the sentence takes depends on what the press would do: a site
  // with no room left cannot start a charge, and it cannot raise the one that is
  // running either — but the second is a different sentence, because the charge
  // carries on at the power it already has.
  const running = action === 'power';
  if (plan.effective_w === null || plan.effective_w === undefined) {
    const reason = typeof plan.reason === 'string' && plan.reason !== ''
      ? plan.reason : 'the reason was not reported.';
    return running
      ? 'The charge keeps running as it is: ' + reason
      : 'A charge cannot start now: ' + reason;
  }
  const at = chargeKw(plan.effective_w);
  const asked = chargeKw(plan.requested_w);
  const parts = [];
  const limit = chargeKw(plan.site_limit_w);
  const house = chargeKw(plan.house_load_w);
  const margin = chargeKw(plan.margin_w);
  if (limit) parts.push('site limit ' + limit);
  if (house) parts.push('house ' + house);
  if (margin) parts.push(margin + ' held back');
  const why = parts.length ? ' (' + parts.join(', ') + ')' : '';
  if (!at) return 'The charge power was not reported.';
  // Asking for the power the device already holds is not a change, and the
  // button is disabled for it: the sentence says why rather than promising a
  // press that would write the number that is already there.
  if (running && typeof runningW === 'number' && runningW === plan.effective_w) {
    return 'The charge is already running at ' + at + why + '.';
  }
  if (asked && plan.effective_w !== plan.requested_w) {
    return asked + ' selected; the charge will run at ' + at + why + '.';
  }
  return (running ? 'Will run at ' : 'Runs at ') + at + why + '.';
}

// What the panel says while a press is in flight, in the status line and on the
// button itself. A write to the inverter takes about a second and a half, and
// the first live attempt showed what an unannounced press costs: the request
// went out, the inverter did not answer it, and nothing on screen had said the
// press had been taken at all.
function chargeBusyLine(action) {
  if (action === 'stop') return 'Stopping the charge…';
  if (action === 'power') return 'Changing the charge…';
  return 'Starting the charge…';
}

// The refusal paragraph is the only thing telling the owner that nothing
// happened and why, so it always says something. The server's own words come
// first; an object or an empty string is not a reason, and rendering one is
// how a page ends up printing [object Object] over a real refusal.
function chargeRefusalText(payload) {
  const detail = (payload !== null && typeof payload === 'object') ? payload.detail : null;
  return (typeof detail === 'string' && detail !== '') ? detail
    : 'That charge request was refused.';
}
// <<< charge-panel

// The wiring reads, writes what the owner pressed, and re-reads. It runs
// nothing by itself: no timer and no page load starts a charge, because those
// are the two ways a service comes to be charging a battery unasked.

// The panel's last read, kept so the preview knows what the button it is
// labelling would do and what the charge is running at.
let currentCharge = null;

async function loadCharge() {
  let charge = null;
  try {
    const r = await fetch('/api/charge');
    // Only a 200 is a configuration. The 404 means the driver cannot report
    // charge configuration and a 401 or 500 is a refusal, so drawing anything
    // from those bodies would turn an error into device state; the panel stays
    // hidden, which is the true thing to say about them.
    if (r.ok) charge = await r.json();
  } catch (err) {
    charge = null;
  }
  const panel = document.getElementById('chargePanel');
  if (!chargePanelVisible(charge)) { panel.hidden = true; currentCharge = null; return; }
  const pick = document.getElementById('chargeCtl');
  const go = document.getElementById('chargeGo');
  const stop = document.getElementById('chargeStop');
  panel.hidden = false;
  // Kept for the preview below: whether the button it labels starts a charge or
  // changes the power of the one that is running, and what that charge runs at.
  currentCharge = charge;
  document.getElementById('chargeStatus').textContent = chargeStatusLine(charge, Date.now());
  document.getElementById('chargeConfig').textContent = chargeConfigLine(charge);
  // A control the API would only refuse is not rendered. A start with a record
  // standing is refused and a power change with nothing recorded has no charge
  // to change, so both come from the record rather than from a default — and an
  // unreadable record gets neither, because there is nothing it can promise.
  const action = chargeGoAction(charge);
  const goOn = action !== null;
  go.hidden = !goOn;
  // The power row belongs to the primary button in either state: choosing how
  // hard a charge runs is the same question before the press and during it.
  pick.hidden = !goOn;
  stop.hidden = !chargeStopVisible(charge);
  // The chosen power, its label and what it will actually run at all come from
  // this one call, so they cannot disagree with each other or with the server.
  if (goOn) await refreshChargePlan();
}

async function refreshCharge() {
  await loadCharge();
}

// What the slider is set to, what pressing would run at, and whether it can run
// at all. Its own request rather than part of the panel's read, because it is
// asked again every time the handle moves and it costs no device access: the
// answer is the site limit and the newest house-load row.
async function refreshChargePlan() {
  const slider = document.getElementById('chargePower');
  const watts = chargeSliderWatts(slider.value);
  const note = document.getElementById('chargePowerNote');
  const go = document.getElementById('chargeGo');
  const action = chargeGoAction(currentCharge);
  // What the device is charging at right now, if a charge of ours is running.
  // The note needs it to tell "this is what it will run at" from "this is what
  // it is already running at", which is the difference between a press that does
  // something and a press that would write the number already there.
  const running = currentCharge && typeof currentCharge.power_w === 'number'
    ? currentCharge.power_w : null;
  document.getElementById('chargePowerOut').textContent = chargeKw(watts) || '—';
  go.textContent = action === 'power' ? chargeChangeLabel(watts) : chargeActionLabel(watts);
  let plan = null;
  try {
    const r = await fetch('/api/charge/plan?power_w=' + encodeURIComponent(watts));
    if (r.ok) plan = await r.json();
  } catch (err) {
    plan = null;
  }
  note.textContent = chargePlanLine(plan, action, running);
  note.hidden = note.textContent === '';
  // The handle's ends come from the API's own bounds, so the range on screen is
  // the range the server enforces — the inverter's AC charge maximum at the top
  // and the driver's floor at the bottom — rather than a copy of them here.
  if (plan && typeof plan.max_w === 'number' && plan.max_w > 0) {
    slider.max = String(plan.max_w / 1000);
  }
  if (plan && typeof plan.min_w === 'number' && plan.min_w > 0) {
    slider.min = String(plan.min_w / 1000);
  }
  // A power that cannot run is not a button to press. The range reaches the
  // inverter's maximum and the site does not always have that much left, so the
  // refusal is shown here instead of being discovered after the press.
  const allowed = !!(plan && plan.effective_w !== null && plan.effective_w !== undefined);
  // Nor is a press that would write the number the device already holds: a
  // charge running at 5 kW is not changed by asking for 5 kW.
  const already = action === 'power' && running !== null && running === watts;
  go.disabled = !allowed || already;
}

// The primary button does one of two things, and which one is decided by the
// record rather than by the button: with nothing recorded it starts a charge,
// and with one standing it changes the power of the charge that is running.
// Both are announced the same way, and neither is offered when the API would
// only refuse it.
async function chargeGoPressed() {
  if (chargeGoAction(currentCharge) === 'power') {
    await setChargePower();
    return;
  }
  await startCharge();
}

async function setChargePower() {
  const why = document.getElementById('chargeWhy');
  const go = document.getElementById('chargeGo');
  const status = document.getElementById('chargeStatus');
  why.textContent = '';
  why.hidden = true;
  go.disabled = true;
  go.textContent = chargeBusyLine('power');
  status.textContent = chargeBusyLine('power');
  try {
    // Only the power travels. The window the charge is running inside and the
    // configuration to put back are the server's, and a page that sent either
    // one would be guessing at what the inverter holds.
    const r = await fetch('/api/charge/power', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        power_w: chargeSliderWatts(document.getElementById('chargePower').value),
      }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      // A refused change leaves the charge running at the power it had, so the
      // sentence says that rather than reading as a stopped charge.
      why.textContent = chargeRefusalText(body);
      why.hidden = false;
    }
  } catch (err) {
    why.textContent = 'This service did not answer.';
    why.hidden = false;
  } finally {
    go.disabled = false;
    await refreshCharge();
  }
}

async function startCharge() {
  const why = document.getElementById('chargeWhy');
  const go = document.getElementById('chargeGo');
  const status = document.getElementById('chargeStatus');
  why.textContent = '';
  why.hidden = true;
  // The press is announced before the request is sent. A write to the inverter
  // takes about a second and a half, and a control that looks identical while
  // it works is one that reads as a press which did not register — which is
  // exactly how the first live attempt looked.
  go.disabled = true;
  go.textContent = chargeBusyLine('start');
  status.textContent = chargeBusyLine('start');
  try {
    // No duration is sent. The server holds the window at 600 minutes and the
    // stop-at-full setting ends the charge as soon as the bank fills, so the
    // window is only the outer bound and the one thing this page chooses is
    // how hard to charge.
    const r = await fetch('/api/charge/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      // The slider's kilowatts, converted in the one place that does it, so the
      // power that is sent is the power the label promised.
      body: JSON.stringify({
        power_w: chargeSliderWatts(document.getElementById('chargePower').value),
      }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      why.textContent = chargeRefusalText(body);
      why.hidden = false;
    }
  } catch (err) {
    why.textContent = 'This service did not answer.';
    why.hidden = false;
  } finally {
    go.disabled = false;
    // Re-read whether it worked or not. A refused start still changed the
    // server: the configuration is recorded before the write is attempted and
    // that record is kept when the write fails, so the panel has to show the
    // stop it now calls for rather than the start it had.
    await refreshCharge();
  }
}

async function stopCharge() {
  const why = document.getElementById('chargeWhy');
  const stop = document.getElementById('chargeStop');
  const status = document.getElementById('chargeStatus');
  why.textContent = '';
  why.hidden = true;
  stop.disabled = true;
  stop.textContent = chargeBusyLine('stop');
  status.textContent = chargeBusyLine('stop');
  try {
    // No body and no settings resent. Stopping writes back the configuration
    // read before the charge started, so anything this page sent alongside the
    // press would be a guess at the inverter's own previous state.
    const r = await fetch('/api/charge/stop', {method: 'POST'});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      why.textContent = chargeRefusalText(body);
      why.hidden = false;
    }
  } catch (err) {
    why.textContent = 'This service did not answer.';
    why.hidden = false;
  } finally {
    stop.disabled = false;
    // The button's own label comes back from the re-read, which knows whether
    // the record still stands or the charge is now simply off.
    await refreshCharge();
  }
}

document.getElementById('chargeGo').addEventListener('click', chargeGoPressed);
document.getElementById('chargeStop').addEventListener('click', stopCharge);
// The label, the number beside the handle and the power the charge would run at
// all follow the handle. It is answered on `input` so the numbers move with the
// drag rather than only when it is let go, and the request is the cheap one that
// asks the inverter nothing.
document.getElementById('chargePower').addEventListener('input', () => {
  refreshChargePlan();
});

loadCharge();

// The two faults this page can hit are different faults and get different
// sentences. One catch around both of them said "the plan endpoint did not
// answer" for a chart that could not be built either, and that is a sentence
// that sends a reader to the service for a fault that is on the page -- it
// cost exactly that on 2026-09-12, when the drawing threw and the endpoint
// was answering correctly the whole time.
async function loadPlan() {
  const note = document.getElementById('planNote');
  let plan;
  try {
    const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const r = await fetch('/api/overnight?tz=' + encodeURIComponent(zone));
    plan = await r.json();
  } catch (err) {
    note.innerHTML = 'The plan endpoint did not answer: ' + esc(String(err));
    return;
  }
  try {
    drawPlan(plan);
  } catch (err) {
    note.innerHTML = 'The plan answered, and the page could not draw it: '
      + esc(String(err));
  }
}

loadPlan();
</script>
</body>
</html>
