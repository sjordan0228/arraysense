// reason on the form; a successful one refreshes the page once the service is
// back, so the redacted current values show what was just set.
async function applyConnection(body, ui) {
  ui.status('Saving and restarting the collector…', 'busy');
  try {
    const r = await fetchTimeout('/api/setup/apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }, 20000);
    const reply = await r.json().catch(() => ({}));
    if (!r.ok) { ui.status(problemText(reply.detail) || `Not accepted (${r.status}).`, 'bad'); ui.reenable(); return; }
  } catch (e) {
    ui.status('The service could not be reached.', 'bad'); ui.reenable(); return;
  }
  // The collector restarts, so /api/status goes quiet and comes back; refresh
  // only once it has, rather than after a blind delay that could land on the
  // outage. If it never reports ready, the form comes back rather than a reload
  // onto a connection-error page.
  ui.status('Saved. The collector is restarting; the page refreshes when it is back.', 'ok');
  watchRestart(
    () => location.reload(),
    () => { ui.status('Saved, but the collector did not report ready. Reload to check its state.', 'warn'); ui.reenable(); },
  );
}

async function load() {
  try {
    const response = await fetch('/api/settings');
    if (!response.ok) throw new Error(`the service answered ${response.status}`);
    const body = await response.json();
    fields = (body && body.fields) || [];
    saved = (body && body.values) || {};
  } catch (e) {
    pageNote(`Settings could not be read: ${e.message}. Nothing can be changed until the `
      + 'service answers.');
    return;
  }
  // Best-effort: the Connection group renders through the wizard picker when the
  // payload is in hand, and falls back to loose controls when it is not, so a
  // failure here degrades the group rather than the whole page.
  try {
    const r = await fetch('/api/setup');
    setupPayload = r.ok ? await r.json() : null;
  } catch (e) {
    setupPayload = null;
  }
  pageNote('');
  render();
  applyDisplay(saved);
  stamp();
}

function stamp() {
  $('stamp').textContent = `read ${new Date().toLocaleTimeString()}`;
}

// ---------------------------------------------------------------------------
// About: what is actually running, and what it says it can read.
//
// Not settings, and deliberately not editable — the version is a fact about the
// process and the capabilities are what the driver declares the hardware to be.
// They are here because this is the page somebody opens when something is
// wrong, and "which version is this" is the first question asked.
//
// Two rules carry over from the readings. A capability nobody declared reads as
// "not declared" and never as "no": a bare source that names its device but
// carries no declaration answers null to every flag, and rendering that as
// "no backup panel" would be the same lie as drawing a missing reading as a
// zero. And the device serial is not shown at all, on a page that goes to
// lengths to mask the same serial three fields above.
// ---------------------------------------------------------------------------

const factRow = (label, value) =>
  `<div class="row"><u>${esc(label)}</u><b>${value}</b></div>`;

// A declared flag as words. Null is the third state and gets its own.
const flagWords = (v) => (v === true ? 'Yes' : v === false ? 'No'
  : `<span class="muted">not declared</span>`);

const countWords = (list) => (Array.isArray(list) ? String(list.length)
  : `<span class="muted">not declared</span>`);

function drawFacts(status, caps) {
  const rows = [];
  rows.push(factRow('Version', status && status.version
    ? esc(String(status.version)) : '<span class="muted">unknown</span>'));

  const devices = caps && Array.isArray(caps.devices) ? caps.devices : [];
  if (!devices.length) {
    rows.push(factRow('Inverter', '<span class="muted">nothing declares itself</span>'));
  }
  devices.forEach((d, i) => {
    const prefix = devices.length > 1 ? `Inverter ${i + 1} ` : '';
    rows.push(factRow(`${prefix}driver`, d.driver
      ? esc(String(d.driver)) : '<span class="muted">not declared</span>'));
    rows.push(factRow(`${prefix}model`, d.model
      ? esc(String(d.model)) : '<span class="muted">not declared</span>'));
    // The flag with teeth. Every kWh this project shows is read off a counter
    // the inverter keeps itself; a family without those counters could only
    // have its energy integrated from power, and a page has to be able to tell
    // a meter reading from an estimate.
    rows.push(factRow(`${prefix}energy figures`,
      d.energy === 'counted' ? 'read from the inverter’s own counters'
        : d.energy === 'estimated' ? 'estimated from power'
        : '<span class="muted">not declared</span>'));
    rows.push(factRow(`${prefix}PV strings`, Number.isFinite(d.pv_strings)
      ? String(d.pv_strings) : '<span class="muted">not declared</span>'));
    rows.push(factRow(`${prefix}backup output`, flagWords(d.backup_output)));
    rows.push(factRow(`${prefix}generator input`, flagWords(d.generator_input)));
    rows.push(factRow(`${prefix}split phase`, flagWords(d.split_phase)));
    rows.push(factRow(`${prefix}three phase`, flagWords(d.three_phase)));
    rows.push(factRow(`${prefix}parallel capable`, flagWords(d.parallel_capable)));
    rows.push(factRow(`${prefix}per-module battery`, flagWords(d.per_module_battery)));
    rows.push(factRow(`${prefix}metrics produced`, countWords(d.metrics)));
    rows.push(factRow(`${prefix}per-module metrics`, countWords(d.battery_module_metrics)));
    // Manufacturer's conversion figures, where the model's spec sheet carries
    // them. Rendered as fact, never as a setting — nothing computes with them.
    if (d.conversion) {
      rows.push('<hr class="facts-rule">');
      rows.push('<div class="conv-head">What this model is rated at</div>');
      const c = d.conversion;
      // Array.includes rather than a Set, because the band-editor test
      // forbids constructing one in the wiring section below //SLICE_TO.
      const approx = Array.isArray(c.approximate) ? c.approximate : [];
      const isApprox = (key) => approx.includes(key);
      const fmt = (val, key) => isApprox(key) ? `~${val}` : String(val);
      rows.push(factRow('CEC efficiency',
        `${fmt(c.cec_pct, 'cec_pct')}%`));
      rows.push(factRow('PV to grid',
        `${fmt(c.max_pv_to_grid_pct, 'max_pv_to_grid_pct')}%`));
      rows.push(factRow('Battery to grid',
        `${fmt(c.max_battery_to_grid_pct, 'max_battery_to_grid_pct')}%`));
      rows.push(factRow('PV to battery',
        `${fmt(c.max_pv_to_battery_pct, 'max_pv_to_battery_pct')}%`));
      rows.push(factRow('Idle draw normal',
        `${fmt(c.idle_normal_w, 'idle_normal_w')} W`));
      rows.push(factRow('Idle draw standby',
        `${fmt(c.idle_standby_w, 'idle_standby_w')} W`));
      if (c.citation) {
        rows.push(factRow('Source', esc(c.citation)));
      }
    }
  });
  $('facts').innerHTML = rows.join('');
}

async function readJson(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${url} answered ${response.status}`);
  return response.json();
}

async function loadFacts() {
  const [status, caps] = await Promise.all([
    readJson('/api/status').catch(() => null),
    readJson('/api/capabilities').catch(() => null),
  ]);
  drawFacts(status, caps);
  $('factnote').textContent = status === null || caps === null
    ? 'Some of this could not be read from the service, and is shown as unknown rather than '
      + 'guessed at.'
    : 'What the driver declares the hardware to be, rather than what it has reported. A '
      + 'capability nothing declared is shown as undeclared, not as absent.';
}

// Boot. Everything above is definitions; nothing runs until here. This page
// does not poll: settings change when somebody changes them, and a background
// refresh would overwrite a half-typed form.
drawNav('settings');
$('save').onclick = save;
$('revert').onclick = () => { render(); clearErrors(); say('', ''); };
// The form is never submitted: every write goes through save() as JSON. Enter
// in a text box would otherwise navigate away from a half-filled page, which
// is a way to lose a tariff nobody would report as a bug.
$('form').addEventListener('submit', (e) => e.preventDefault());
load();
loadFacts();
</script>
</body>
</html>
