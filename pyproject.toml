[project]
name = "arraysense"
version = "1.1.9"
description = "Open-source solar and battery monitoring for EG4 and LuxPower inverters"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Pinned to an upstream pre-release tag, not to a PyPI version, and the
    # distinction is the whole point. Stock pylxpweb rewrites an unreported
    # battery state of health into 100, which is also a real reading, so a
    # silent BMS is indistinguishable from a healthy bank (upstream issue
    # #309). This project reported that as PR #286, a three-line change to
    # the transport decoders; upstream merged it as the base of PR #316 and
    # completed it, keeping our commit with authorship preserved. The
    # completion mattered: with the three lines alone, BatteryData's own
    # post-init rewrote the None straight back to 100 — empirically true of
    # the fork commit this pin replaced, so per-battery SoH was still
    # fabricated here in production. Their branch also carries what ours
    # never reached: is_corrupt() tolerating the None canary, bank min/max
    # over possibly-None values, the master/slave protocol decoders, and the
    # cloud path's own or-100.
    #
    # The pin is upstream v0.10.0b5, the release carrying PR #316, and not
    # PyPI's 0.9.40, which is the newest stable and predates the fix. A
    # plain `==0.9.38` would not do either, because `uv sync` reinstalls
    # stock over a hand-patched venv and the loss is silent. Move to a plain
    # PyPI spec (and drop allow-direct-references with it) once 0.10.0 goes
    # stable — the 0.9.38-to-0.10.0 jump crosses the serial transport and
    # the battery registers, and only the live inverter can tell you it
    # worked, so the first deploy after this one watches the battery panels.
    "pylxpweb @ git+https://github.com/joyfulhouse/pylxpweb@v0.10.0b5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyserial>=3.5",
]

[tool.hatch.metadata]
# Required for the git pin on pylxpweb above. Remove with it.
allow-direct-references = true

[project.scripts]
arraysense = "arraysense.__main__:main"

[dependency-groups]
dev = [
    # The referee for src/arraysense/solar.py. A development dependency on
    # purpose: the physics ships as our own arithmetic, and this is what proves
    # that arithmetic matches the library the industry trusts. It must never
    # reach [project] dependencies — the collector would inherit numpy and
    # pandas on a Raspberry Pi that has no use for them.
    "pvlib>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arraysense"]
artifacts = ["src/arraysense/web/*.html", "src/arraysense/web/uPlot.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# tools/ holds the one-time migration scripts. They are shipped, so they are
# tested, and that means they have to be importable by name.
pythonpath = ["tools"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# Plans and specs contain illustrative code blocks; they are documents, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "ANN", "RUF"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools", "install.py"]

[[tool.mypy.overrides]]
module = "pylxpweb.*"
ignore_missing_imports = true
