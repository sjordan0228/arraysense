[project]
name = "arraysense"
version = "1.1.9"
description = "Open-source solar and battery monitoring for EG4 and LuxPower inverters"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Pinned to a fork commit, not to a PyPI version, and the distinction is the
    # whole point. Stock pylxpweb rewrites an unreported battery state of health
    # into 100, which is also a real reading, so a silent BMS is indistinguishable
    # from a healthy bank (upstream issue #309, fix in PR #286).
    #
    # The commit is v0.9.38 plus that three-line change and nothing else, so this
    # moves no version: it is the library the Pi already runs, with the fix in it.
    # A plain `==0.9.38` would not do, because `uv sync` reinstalls stock over a
    # hand-patched venv and the loss is silent. Upgrading the library is a separate
    # job; 0.9.38 to 0.9.40 is 59 commits across the serial transport and the
    # battery registers, and only the live inverter can tell you it worked.
    # Move back to a PyPI spec once upstream releases the fix.
    "pylxpweb @ git+https://github.com/sjordan0228/pylxpweb@c01ba5b12f8e9fdd8137be4801ad5480e5193b4d",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyserial>=3.5",
]

[tool.hatch.metadata]
# Required for the git pin on pylxpweb above. Remove with it.
allow-direct-references = true

[project.scripts]
arraysense = "arraysense.__main__:main"

[dependency-groups]
dev = [
    # The referee for src/arraysense/solar.py. A development dependency on
    # purpose: the physics ships as our own arithmetic, and this is what proves
    # that arithmetic matches the library the industry trusts. It must never
    # reach [project] dependencies — the collector would inherit numpy and
    # pandas on a Raspberry Pi that has no use for them.
    "pvlib>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arraysense"]
artifacts = ["src/arraysense/web/*.html", "src/arraysense/web/uPlot.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# tools/ holds the one-time migration scripts. They are shipped, so they are
# tested, and that means they have to be importable by name.
pythonpath = ["tools"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# Plans and specs contain illustrative code blocks; they are documents, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "ANN", "RUF"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools", "install.py"]

[[tool.mypy.overrides]]
module = "pylxpweb.*"
ignore_missing_imports = true
