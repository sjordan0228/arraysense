# Solar ArraySense configuration.
# A reference for hand-configuration. Copying it into /etc/arraysense/config.toml
# skips the first-run setup wizard, so this file is only for configuring by hand.
# This file identifies your hardware — keep it out of version control.

# Address of the inverter's WiFi dongle. Give it a static DHCP lease.
dongle_host = "192.168.1.50"

# The dongle's 10-character serial. On its label, in your router's DHCP
# list, or broadcast as the dongle's WiFi access point name.
dongle_serial = "BA12345678"

# The dongle's TCP port. Newer firmware removes port 8000 and Ethernet
# dongles never had it, so this may need to change when you switch to
# a different dongle or after a firmware update.
dongle_port = 8000

# The inverter's 10-character serial. Read it from the inverter itself:
# other tools have been observed reporting a different value, and a
# mismatch makes every read fail.
inverter_serial = "CE12345678"

# Seconds between reads. The dongle answers when it answers, so asking faster
# than the round trip takes gains nothing.
poll_interval = 11.0

# Which family of inverter to read. Leave this alone unless you know you
# need something else: it covers the EG4 and LuxPower hybrids reached over
# the WiFi dongle. A wrong name is reported at startup along with the list
# of names that work.
driver = "eg4_luxpower"

# Which model within the driver family. The wizard sets this from the
# model you choose, and it is worth setting: a blank value falls back to
# the family's own defaults, which describe the hybrids. On an off-grid
# machine — a 6000XP or a 12000XP — that is the wrong description, and
# readings the model would have withheld get stored instead.
# A blank value also stands down the check that would otherwise notice
# the inverter answering is not the model configured: with nothing
# configured there is nothing to disagree with.
model = ""

# Where battery module data comes from. A blank value derives the source
# from the driver: relayed from the BMS when the inverter family carries
# that, none otherwise. 'relayed' and 'none' are the explicit forms of
# those two choices. 'direct' is reserved for a future battery driver.
battery_source = ""

# Where the database is written. Prefer an SSD over a Pi's SD card.
database_path = "/var/lib/arraysense/arraysense.db"

# How durably a reading must land before the write is done. 'full'
# fsyncs every commit and is the safe default. 'normal' syncs at
# checkpoint instead — measured on a Raspberry Pi, 200 polls cost 207
# fsyncs at full and 7 at normal — which matters on flash storage that
# wears out. Neither risks corruption; 'normal' can lose the most recent
# readings, roughly the last five minutes, if power is cut abruptly.
synchronous = "full"

# How to reach the inverter: 'dongle' (default) for the WiFi dongle's
# TCP port, or 'modbus_serial' for a USB-to-RS485 adapter. When set to
# 'modbus_serial', serial_device must also be set.
transport = "dongle"

# Device path for the USB-to-RS485 adapter. Only used when transport
# is 'modbus_serial'. Nothing expands a glob here, so give a real path:
# '/dev/ttyUSB0', or better a stable one that survives replugging, such
# as '/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0' or a udev symlink.
serial_device = ""

# Baud rate for the serial connection. Defaults to 19200, which is the
# standard for EG4/LuxPower inverters.
serial_baud = 19200

# Modbus unit ID for the serial connection. Defaults to 1.
serial_unit_id = 1
